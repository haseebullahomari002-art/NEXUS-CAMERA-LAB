
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS CAMERA LAB</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:22px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#080b16;
 color:#fff;
 font-family:Arial,sans-serif;
}

.app{
 width:100%;
 max-width:440px;
 padding:24px;
 border-radius:24px;
 background:#111a2e;
 border:1px solid #33466d;
 box-shadow:0 0 35px #536dfe22;
}

.logo{
 text-align:center;
 color:#65d9ff;
 font-size:27px;
 font-weight:bold;
 letter-spacing:2px;
}

.subtitle{
 text-align:center;
 color:#aebbd2;
 line-height:1.9;
 font-size:14px;
}

video,img{
 width:100%;
 border-radius:15px;
 margin-top:15px;
 background:#05070d;
}

img{display:none}

button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 margin-top:12px;
 font-size:16px;
 font-weight:bold;
 color:white;
 background:#536dfe;
 cursor:pointer;
}

button:disabled{
 opacity:.4;
 cursor:not-allowed;
}

.secondary{background:#263a58}
.success{background:#078e73}
.danger{background:#a43b54}

.consent{
 display:flex;
 gap:10px;
 color:#d5dfef;
 line-height:1.8;
 font-size:13px;
 margin-top:20px;
}

#status{
 text-align:center;
 margin-top:18px;
 padding:13px;
 border-radius:10px;
 background:#080f20;
 color:#70e6c0;
 font-size:13px;
 line-height:1.8;
}

.footer{
 text-align:center;
 color:#667995;
 font-size:11px;
 margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">NEXUS CAMERA LAB</div>

<p class="subtitle">
سامانه ثبت و ذخیره عکس
<br>
دوربین فقط پس از اجازه شما فعال می‌شود.
</p>

<label class="consent">
<input type="checkbox" id="consent">
<span>
با فعال‌کردن دوربین و ذخیره عکسی که خودم انتخاب و تأیید می‌کنم موافق هستم.
</span>
</label>

<button id="start">فعال‌کردن دوربین</button>

<video id="video" autoplay playsinline hidden></video>

<button id="capture" disabled>
گرفتن عکس
</button>

<canvas id="canvas" hidden></canvas>

<img id="preview" alt="پیش‌نمایش عکس">

<button id="send" class="success" disabled>
تأیید و ارسال عکس
</button>

<button id="stop" class="danger">
بستن دوربین
</button>

<div id="status">
سامانه آماده است.
</div>

<div class="footer">
NEXUS PROJECT • CAMERA LAB
</div>

</div>

<script>

// SUPABASE CONFIGURATION

const SUPABASE_URL =
"https://wxovglpgcddlmhropvtv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ykxw1h1xKfIqrKyzTXjsjw_lMtub-Wk";

const BUCKET = "nexus-photos";

// INITIALIZATION

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");

const consent = document.getElementById("consent");

const startBtn = document.getElementById("start");
const captureBtn = document.getElementById("capture");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stop");

const statusBox = document.getElementById("status");

let stream = null;
let photoBlob = null;
let currentUser = null;

function showStatus(message){
 statusBox.textContent = message;
}

// CAMERA

startBtn.addEventListener("click", async()=>{

 if(!consent.checked){
  showStatus("لطفاً ابتدا رضایت خود را تأیید کنید.");
  return;
 }

 try{

  showStatus("در حال فعال‌سازی دوربین...");

  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error("دوربین در این مرورگر پشتیبانی نمی‌شود. از HTTPS استفاده کنید.");
  }

  stream = await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"user"},
   audio:false
  });

  video.srcObject = stream;
  video.hidden = false;

  await video.play();

  captureBtn.disabled = false;

  showStatus("دوربین فعال است. می‌توانید عکس بگیرید.");

 }catch(error){

  showStatus("خطا: "+error.message);

 }

});

// CAPTURE

captureBtn.addEventListener("click",()=>{

 if(!stream) return;

 canvas.width = video.videoWidth;
 canvas.height = video.videoHeight;

 const ctx = canvas.getContext("2d");

 ctx.drawImage(video,0,0);

 canvas.toBlob(blob=>{

  if(!blob){
   showStatus("گرفتن عکس ناموفق بود.");
   return;
  }

  photoBlob = blob;

  preview.src = URL.createObjectURL(blob);
  preview.style.display = "block";

  sendBtn.disabled = false;

  showStatus("عکس گرفته شد. برای ارسال آن را تأیید کنید.");

 },"image/jpeg",0.85);

});

// UPLOAD

sendBtn.addEventListener("click",async()=>{

 if(!photoBlob) return;

 const confirmed = confirm(
  "آیا مطمئن هستید که می‌خواهید این عکس را در فضای ذخیره‌سازی خصوصی ثبت کنید؟"
 );

 if(!confirmed) return;

 sendBtn.disabled = true;

 try{

  showStatus("در حال آماده‌سازی حساب...");

  const {data,error} =
   await db.auth.signInAnonymously();

  if(error) throw error;

  currentUser = data.user;

  const filename =
   currentUser.id+"/"+Date.now()+".jpg";

  showStatus("در حال ارسال عکس...");

  const {error:uploadError} = await db.storage
   .from(BUCKET)
   .upload(filename,photoBlob,{
    contentType:"image/jpeg",
    upsert:false
   });

  if(uploadError) throw uploadError;

  showStatus("عکس با موفقیت ذخیره شد!");

  photoBlob = null;
  sendBtn.disabled = true;

 }catch(error){

  showStatus("خطا در ارسال: "+error.message);
  sendBtn.disabled = false;

 }

});

// STOP CAMERA

stopBtn.addEventListener("click",()=>{

 if(stream){

  stream.getTracks().forEach(track=>{
   track.stop();
  });

  stream = null;
 }

 video.srcObject = null;
 video.hidden = true;

 captureBtn.disabled = true;

 showStatus("دوربین بسته شد.");

});

</script>

</body>
</html>
